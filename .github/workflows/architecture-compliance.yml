name: architecture-compliance

on:
  pull_request:
    paths:
      - "AURA/**"
      - ".github/workflows/architecture-compliance.yml"
  push:
    branches:
      - main
      - "stabilization/**"
    paths:
      - "AURA/**"
      - ".github/workflows/architecture-compliance.yml"

jobs:
  architecture-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aura-sdk validation dependencies
        run: python -m pip install -e AURA/workspace/aura-sdk[dev]

      - name: Enforce architecture boundaries
        run: python AURA/scripts/architecture-enforce.py
