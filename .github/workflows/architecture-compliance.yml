name: stabilization-gates

on:
  pull_request:
    paths:
      - "AURA/**"
      - ".github/workflows/architecture-compliance.yml"
  push:
    branches:
      - main
      - "stabilization/**"
    paths:
      - "AURA/**"
      - ".github/workflows/architecture-compliance.yml"

jobs:
  stabilization-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic CI/runtime parity suite
        run: |
          cd AURA
          ./scripts/ci-parity.sh
