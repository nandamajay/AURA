[project]
name = "aura-agents"
version = "0.1.0"
description = "AURA CLI Agents — autonomous agents for upstreaming audio drivers"
requires-python = ">=3.12"
dependencies = [
    "aura-sdk[log]",
    "httpx>=0.26",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agents"]

[project.scripts]
aura-agents = "aura_agents.cli:main"
