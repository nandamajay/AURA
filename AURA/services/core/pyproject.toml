[project]
name = "aura-core"
version = "0.1.0"
description = "AURA Core Orchestrator — task scheduling, agent lifecycle, governance"
requires-python = ">=3.12"
dependencies = [
    "aura-sdk[db,log]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
