[project]
name = "llm-gateway"
version = "0.1.0"
description = "AURA LLM Gateway — OpenAI proxy with caching and budget control"
requires-python = ">=3.12"
dependencies = [
    "aura-sdk[log]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
