[project]
name = "ws-server"
version = "0.1.0"
description = "AURA WebSocket + SSE Server — real-time event streaming"
requires-python = ">=3.12"
dependencies = [
    "aura-sdk[log]",
    "fastapi>=0.110",
    "httpx>=0.26",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_server"]
