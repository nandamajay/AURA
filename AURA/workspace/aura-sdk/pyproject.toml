[project]
name = "aura-sdk"
version = "0.1.0"
description = "Shared SDK for the AURA platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typing-extensions",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "aiosqlite>=0.20"]
log = ["structlog>=24.1"]
all = ["sqlalchemy>=2.0", "aiosqlite>=0.20", "structlog>=24.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
