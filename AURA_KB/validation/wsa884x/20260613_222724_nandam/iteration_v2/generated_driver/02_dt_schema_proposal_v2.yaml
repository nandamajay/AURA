$id: http://devicetree.org/schemas/sound/qcom,wsa8840.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WSA884x smart speaker amplifier

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: sdw20217020400
  reg:
    maxItems: 1
  '#sound-dai-cells':
    const: 0
  powerdown-gpios:
    maxItems: 1
  reset-gpios:
    maxItems: 1
  qcom,port-mapping:
    minItems: 6
    maxItems: 6
  vdd-1p8-supply: true
  vdd-io-supply: true

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - vdd-1p8-supply
  - vdd-io-supply

oneOf:
  - required: [powerdown-gpios]
  - required: [reset-gpios]

unevaluatedProperties: false
